<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>三栏富文本编辑器 - 终极体验版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/languages/xml.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            secondary: '#8b5cf6',
            dark: { 100: '#1e293b', 200: '#1e293b', 300: '#0f172a', 400: '#020617' },
            editor: { bg: '#ffffff', text: '#1e293b', selection: '#dbeafe', toolbar: '#f1f5f9' },
            iphone: { frame: '#1a1a1a', bezel: '#000000', screen: '#ffffff' }
          },
          fontFamily: {
            mono: ['Fira Code', 'Consolas', 'Monaco', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .editor-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .editor-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
      .editor-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      .html-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .html-scrollbar::-webkit-scrollbar-track { background: #1e1e2e; }
      .html-scrollbar::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }
      .resizer { cursor: col-resize; background: linear-gradient(to right, transparent, #e2e8f0, transparent); transition: all 0.2s ease; }
      .resizer:hover { background: linear-gradient(to right, transparent, #6366f1, transparent); }
      .panel-header { background: linear-gradient(to bottom, #1e293b, #0f172a); }
      .toolbar-btn { @apply px-2 py-1 rounded hover:bg-gray-200 transition-colors duration-150 text-gray-700; }
      .toolbar-btn.active { @apply bg-primary/20 text-primary; }
      .rich-editor { outline: none; min-height: 100%; }
      .rich-editor h1 { @apply text-2xl font-bold mb-4 mt-6; }
      .rich-editor h2 { @apply text-xl font-bold mb-3 mt-5; }
      .rich-editor h3 { @apply text-lg font-bold mb-2 mt-4; }
      .rich-editor p { @apply mb-3; }
      .rich-editor ul { @apply list-disc pl-6 mb-3; }
      .rich-editor ol { @list-decimal pl-6 mb-3; }
      .rich-editor blockquote { @apply border-l-4 border-gray-300 pl-4 italic text-gray-600 my-4; }
      .rich-editor a { @apply text-blue-600 underline; }
      .rich-editor code { @apply bg-gray-100 px-1 py-0.5 rounded text-sm font-mono; }
      .rich-editor pre { @apply bg-gray-100 p-3 rounded text-sm font-mono overflow-x-auto mb-3; }
      .rich-editor table { @apply border-collapse w-full mb-3; }
      .rich-editor th, .rich-editor td { @apply border border-gray-300 px-3 py-2; }
      .rich-editor th { @apply bg-gray-50 font-bold; }
      
      .iphone-container { display: flex; align-items: center; justify-content: center; height: 100%; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); overflow: auto; }
      .iphone-frame { position: relative; width: 280px; height: 607px; background: #1a1a1a; border-radius: 54px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); padding: 12px; flex-shrink: 0; }
      .iphone-bezel { position: relative; width: 100%; height: 100%; background: #000000; border-radius: 42px; overflow: hidden; }
      .iphone-dynamic-island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 105px; height: 31px; background: #000000; border-radius: 20px; z-index: 10; }
      .iphone-screen { width: 100%; height: 100%; background: #ffffff; }
      .iphone-side-button { position: absolute; background: #1a1a1a; border-radius: 2px; }
      .iphone-power-btn { right: -3px; top: 145px; width: 3px; height: 95px; }
      .iphone-volume-up { left: -3px; top: 120px; width: 3px; height: 45px; }
      .iphone-volume-down { left: -3px; top: 175px; width: 3px; height: 45px; }
      .iphone-silent-switch { left: -3px; top: 75px; width: 3px; height: 30px; }
      
      .html-editor-container { width: 100%; height: 100%; overflow: hidden !important; background: #1e1e2e; }
      .html-scroll-container { display: flex; width: 100%; height: 100%; overflow: auto; }
      .line-numbers { flex-shrink: 0; width: 50px; padding: 1rem 0.5rem 1rem 0.25rem; text-align: right; color: #6c7086; font-family: 'Fira Code', Consolas, monospace; font-size: 0.875rem; line-height: 24px; user-select: none; border-right: 1px solid #313244; background: #181825; white-space: nowrap; min-height: 100%; }
      .line-number { display: block; height: 24px !important; line-height: 24px !important; margin: 0 !important; padding: 0 !important; position: relative; }
      .line-indicator { position: absolute; left: -4px; top: 12px; transform: translateY(-50%); width: 8px; height: 8px; border-radius: 50%; background: #22c55e; opacity: 0; transition: opacity 0.2s ease; }
      .line-indicator.active { opacity: 1; box-shadow: 0 0 8px #22c55e; }
      .code-wrapper { flex: 1; position: relative; min-height: 100%; background: #1e1e2e; overflow: visible; }
      .code-highlight, .code-textarea { 
        position: absolute; top: 0; left: 0; width: 100%; min-height: 100%; 
        padding: 1rem; padding-left: 0.75rem; font-family: 'Fira Code', Consolas, monospace; 
        font-size: 0.875rem; line-height: 24px !important; tab-size: 2; 
        white-space: pre !important;
        word-wrap: normal !important;
        word-break: normal !important;
        box-sizing: border-box; margin: 0; border: none; outline: none; 
        overflow: hidden;
      }
      .code-highlight { pointer-events: none; background: #1e1e2e; z-index: 1; }
      .code-textarea { color: transparent !important; background: transparent !important; caret-color: #cdd6f4 !important; resize: none; z-index: 2; }
      .code-textarea::selection { background: rgba(205, 214, 244, 0.2) !important; color: transparent !important; }
      .hljs { 
        background: transparent !important; padding: 0 !important; margin: 0 !important; 
        line-height: 24px !important; display: inline; 
        white-space: pre !important;
        word-break: normal !important; 
      }
    }
  </style>
</head>
<body class="bg-dark-400 text-gray-200 font-sans h-screen flex flex-col overflow-hidden">
  <header class="bg-dark-300 border-b border-gray-700/50 py-3 px-6 flex items-center justify-between shadow-lg z-10">
    <div class="flex items-center gap-3"><i class="fa fa-edit text-primary text-2xl"></i><h1 class="text-xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">富文本编辑器</h1></div>
    <div class="flex items-center gap-3">
      <button id="copyHtmlBtn" class="px-4 py-2 bg-dark-200 hover:bg-dark-100 rounded-lg flex items-center gap-2"><i class="fa fa-copy"></i><span>复制HTML</span></button>
      <button id="clearBtn" class="px-4 py-2 bg-dark-200 hover:bg-dark-100 rounded-lg flex items-center gap-2"><i class="fa fa-trash"></i><span>清空</span></button>
    </div>
  </header>

  <main class="flex-1 flex overflow-hidden">
    <div class="flex flex-col h-full" id="previewPanel">
      <div class="panel-header px-4 py-2 border-b border-gray-700/50 flex items-center justify-between"><h2 class="font-medium flex items-center gap-2"><i class="fa fa-mobile text-green-400 text-lg"></i>iPhone 15 真实预览</h2><span class="text-xs text-gray-400" id="previewStatus">就绪</span></div>
      <div class="flex-1 overflow-hidden"><div class="iphone-container"><div class="iphone-frame"><div class="iphone-side-button iphone-power-btn"></div><div class="iphone-side-button iphone-volume-up"></div><div class="iphone-side-button iphone-volume-down"></div><div class="iphone-side-button iphone-silent-switch"></div><div class="iphone-bezel"><div class="iphone-dynamic-island"></div><div class="iphone-screen"><iframe id="previewFrame" class="w-full h-full border-0" title="iPhone 15预览"></iframe></div></div></div></div></div>
    </div>
    <div class="resizer w-1" id="resizer1"></div>

    <div class="flex flex-col h-full bg-white" id="editorPanel">
      <div class="panel-header px-4 py-2 border-b border-gray-700/50 flex items-center justify-between"><h2 class="font-medium flex items-center gap-2"><i class="fa fa-pencil text-blue-400"></i>富文本编辑</h2><span class="text-xs text-gray-400" id="cursorPosition">行: 1, 列: 1</span></div>
      <div class="bg-editor-toolbar border-b border-gray-200 px-2 py-1 flex flex-wrap gap-1">
        <button class="toolbar-btn" data-command="bold" title="加粗 (Ctrl+B)"><i class="fa fa-bold"></i></button>
        <button class="toolbar-btn" data-command="italic" title="斜体 (Ctrl+I)"><i class="fa fa-italic"></i></button>
        <button class="toolbar-btn" data-command="underline" title="下划线 (Ctrl+U)"><i class="fa fa-underline"></i></button>
        <button class="toolbar-btn" data-command="strikeThrough" title="删除线"><i class="fa fa-strikethrough"></i></button>
        <div class="w-px h-6 bg-gray-300 mx-1 self-center"></div>
        <button class="toolbar-btn" data-command="justifyLeft" title="左对齐"><i class="fa fa-align-left"></i></button>
        <button class="toolbar-btn" data-command="justifyCenter" title="居中对齐"><i class="fa fa-align-center"></i></button>
        <button class="toolbar-btn" data-command="justifyRight" title="右对齐"><i class="fa fa-align-right"></i></button>
        <div class="w-px h-6 bg-gray-300 mx-1 self-center"></div>
        <button class="toolbar-btn" data-command="insertUnorderedList" title="无序列表"><i class="fa fa-list-ul"></i></button>
        <button class="toolbar-btn" data-command="insertOrderedList" title="有序列表"><i class="fa fa-list-ol"></i></button>
        <button class="toolbar-btn" data-command="outdent" title="减少缩进"><i class="fa fa-outdent"></i></button>
        <button class="toolbar-btn" data-command="indent" title="增加缩进"><i class="fa fa-indent"></i></button>
        <div class="w-px h-6 bg-gray-300 mx-1 self-center"></div>
        <select id="headingSelect" class="toolbar-btn h-7 text-sm"><option value="">正文</option><option value="h1">标题 1</option><option value="h2">标题 2</option><option value="h3">标题 3</option><option value="h4">标题 4</option></select>
        <div class="w-px h-6 bg-gray-300 mx-1 self-center"></div>
        <button class="toolbar-btn" id="linkBtn" title="插入链接"><i class="fa fa-link"></i></button>
        <button class="toolbar-btn" id="imageBtn" title="插入图片"><i class="fa fa-image"></i></button>
        <button class="toolbar-btn" data-command="blockquote" title="引用"><i class="fa fa-quote-left"></i></button>
        <button class="toolbar-btn" data-command="code" title="代码"><i class="fa fa-code"></i></button>
        <div class="w-px h-6 bg-gray-300 mx-1 self-center"></div>
        <button class="toolbar-btn" data-command="undo" title="撤销 (Ctrl+Z)"><i class="fa fa-undo"></i></button>
        <button class="toolbar-btn" data-command="redo" title="重做 (Ctrl+Y)"><i class="fa fa-repeat"></i></button>
      </div>
      <div class="flex-1 overflow-auto relative"><div id="richEditor" class="rich-editor w-full h-full p-6 text-editor-text leading-relaxed editor-scrollbar" contenteditable="true" spellcheck="false"></div></div>
    </div>
    <div class="resizer w-1" id="resizer2"></div>

    <div class="flex flex-col h-full" id="htmlPanel">
      <div class="panel-header px-4 py-2 border-b border-gray-700/50 flex items-center justify-between"><h2 class="font-medium flex items-center gap-2"><i class="fa fa-html5 text-orange-400"></i>HTML源码</h2><span class="text-xs text-gray-400" id="htmlSize">0 字符</span></div>
      <div class="flex-1 overflow-hidden relative">
        <div class="html-editor-container">
          <div class="html-scroll-container html-scrollbar" id="htmlScrollContainer">
            <div class="line-numbers" id="lineNumbers"></div>
            <div class="code-wrapper"><div class="code-highlight" id="codeHighlight"></div><textarea id="htmlSource" class="code-textarea" placeholder="HTML源码将在此显示..."></textarea></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark-300 border-t border-gray-700/50 py-2 px-6 flex items-center justify-between text-xs text-gray-400">
    <div class="flex items-center gap-4"><span>© 2026 富文本编辑器</span><span class="text-primary">●</span><span>实时同步已启用</span></div>
    <div class="flex items-center gap-4"><span id="totalWords">总字数: 0</span><span id="totalChars">总字符: 0</span></div>
  </footer>

  <script>
    const richEditor = document.getElementById('richEditor');
    const htmlSource = document.getElementById('htmlSource');
    const codeHighlight = document.getElementById('codeHighlight');
    const lineNumbers = document.getElementById('lineNumbers');
    const htmlScrollContainer = document.getElementById('htmlScrollContainer');
    const previewFrame = document.getElementById('previewFrame');
    const previewStatus = document.getElementById('previewStatus');
    const cursorPosition = document.getElementById('cursorPosition');
    const htmlSize = document.getElementById('htmlSize');
    const totalWords = document.getElementById('totalWords');
    const totalChars = document.getElementById('totalChars');
    const copyHtmlBtn = document.getElementById('copyHtmlBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resizer1 = document.getElementById('resizer1');
    const resizer2 = document.getElementById('resizer2');
    const previewPanel = document.getElementById('previewPanel');
    const editorPanel = document.getElementById('editorPanel');
    const htmlPanel = document.getElementById('htmlPanel');
    const headingSelect = document.getElementById('headingSelect');
    const linkBtn = document.getElementById('linkBtn');
    const imageBtn = document.getElementById('imageBtn');
    const toolbarBtns = document.querySelectorAll('.toolbar-btn[data-command]');

    const LINE_HEIGHT = 24;
    let isLocating = false;
    let lastTargetLine = null; // 记录最后一次定位的行号

    // 初始化内容
    const initialContent = `<h1>欢迎使用富文本编辑器</h1>
<p>这是一个功能强大的三栏富文本编辑器，您可以在中间进行可视化编辑，左侧实时预览iPhone效果，右侧查看对应的HTML源码。现在行间距完全正常，且绿点定位绝对精准！</p>
<h2>核心改进</h2>
<ul>
<li><strong>精准行定位</strong>：选中任意文字，右侧源码区绿色圆点会精确落在对应标签所在行。</li>
<li><strong>所见即所得</strong>：像使用Word一样编辑内容</li>
<li><strong>iPhone 15真实预览</strong>：完全按照真实比例和分辨率显示</li>
<li><strong>HTML语法高亮</strong>：代码带有漂亮的语法高亮显示</li>
<li><strong>横向滚动条</strong>：超长代码行不再自动折行，使用横向滚动查看</li>
<li><strong>完美对齐</strong>：行号与代码行精确对齐，无错位</li>
<li><strong>可调整面板</strong>：自由拖拽调整三个区域的大小</li>
</ul>
<h2>测试定位功能</h2>
<p>请将光标点击到上方“核心改进”这一行，右侧源码区应该高亮 <code>&lt;h2&gt;核心改进&lt;/h2&gt;</code> 所在的行。</p>
<p><a href="#" target="_blank">链接示例：点击这里的文字试试定位效果</a></p>
<blockquote><p>引用块：定位同样精准，绿点会落在 blockquote 标签所在行。</p></blockquote>`;
    richEditor.innerHTML = initialContent;
    updatePreview();
    updateHtmlSource();
    updateStats();
    updateLineNumbers();
    updateCodeHighlight();

    // 通用更新
    function updatePreview() {
      const content = richEditor.innerHTML;
      const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
      previewDoc.open();
      previewDoc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;padding:16px;padding-top:59px;padding-bottom:34px;line-height:1.5;color:#1c1c1e;background:#fff;font-size:17px;}h1{font-size:28px;font-weight:700;margin:20px 0 16px;}h2{font-size:22px;font-weight:600;margin:18px 0 12px;}h3{font-size:19px;font-weight:600;margin:16px 0 10px;}p{margin:12px 0;}ul,ol{padding-left:24px;margin:12px 0;}blockquote{border-left:4px solid #d1d1d6;padding-left:16px;margin:20px 0;color:#8e8e93;}a{color:#007aff;text-decoration:none;}code{background:#f2f2f7;padding:2px 6px;border-radius:4px;}pre{background:#f2f2f7;padding:16px;border-radius:8px;overflow:auto;}</style></head><body>${content}</body></html>`);
      previewDoc.close();
      previewStatus.textContent = '已更新';
      setTimeout(() => previewStatus.textContent = '就绪', 800);
    }

    function updateHtmlSource() {
      let html = richEditor.innerHTML.trim();
      html = html.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      htmlSource.value = html;
      updateCodeHighlight();
      updateLineNumbers();
      htmlSize.textContent = `${html.length} 字符`;
    }

    function updateCodeHighlight() {
      const html = htmlSource.value;
      const highlighted = hljs.highlight(html, { language: 'xml' }).value;
      codeHighlight.innerHTML = highlighted;
      codeHighlight.style.width = `${Math.max(htmlSource.scrollWidth, htmlScrollContainer.clientWidth)}px`;
      codeHighlight.parentElement.style.height = `${htmlSource.scrollHeight}px`;
    }

    function updateLineNumbers() {
      const lines = htmlSource.value.split('\n');
      let html = '';
      for (let i = 1; i <= lines.length; i++) {
        html += `<div class="line-number" data-line="${i}"><span class="line-indicator"></span>${i}</div>`;
      }
      lineNumbers.innerHTML = html;
    }

    function updateStats() {
      const text = richEditor.innerText || richEditor.textContent;
      totalChars.textContent = `总字符: ${text.length}`;
      totalWords.textContent = `总字数: ${text.replace(/\s/g, '').length}`;
    }

    function execCommand(command, value = null) {
      document.execCommand(command, false, value);
      richEditor.focus();
      updatePreview();
      updateHtmlSource();
      updateToolbarState();
    }

    function updateToolbarState() {
      toolbarBtns.forEach(btn => {
        const cmd = btn.getAttribute('data-command');
        if (document.queryCommandState(cmd)) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      const formatBlock = document.queryCommandValue('formatBlock');
      headingSelect.value = formatBlock.toLowerCase();
    }

    // ✅ 核心1：仅显示绿点，不执行任何滚动
    function showLineIndicator(lineNumber) {
      document.querySelectorAll('.line-indicator.active').forEach(ind => ind.classList.remove('active'));
      if (!lineNumber) return;
      lastTargetLine = lineNumber;
      const targetLineDiv = lineNumbers.querySelector(`.line-number[data-line="${lineNumber}"]`);
      if (targetLineDiv) {
        const indicator = targetLineDiv.querySelector('.line-indicator');
        if (indicator) indicator.classList.add('active');
      }
    }

    // ✅ 核心2：仅主动调用时执行滚动（点击富文本时才触发）
    function scrollToLine(lineNumber) {
      if (!lineNumber) return;
      const scrollTop = (lineNumber - 1) * LINE_HEIGHT;
      const containerRect = htmlScrollContainer.getBoundingClientRect();
      const targetY = scrollTop - containerRect.height / 2 + LINE_HEIGHT / 2;
      htmlScrollContainer.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
    }

    // 精准定位：只计算行号，显示绿点
    function locateCurrentLine(needScroll = false) {
      if (isLocating) return;
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return;
      const range = selection.getRangeAt(0);
      if (!richEditor.contains(range.commonAncestorContainer)) {
        showLineIndicator(null);
        return;
      }

      isLocating = true;
      try {
        const savedRange = range.cloneRange();
        let container = range.startContainer;
        if (container.nodeType === Node.TEXT_NODE) container = container.parentElement;
        let targetElement = container;
        while (targetElement && targetElement !== richEditor && !targetElement.parentElement) targetElement = targetElement.parentElement;
        if (!targetElement || targetElement === richEditor) {
          const firstChild = richEditor.firstElementChild;
          if (firstChild) targetElement = firstChild;
          else return;
        }

        const marker = `<!-- CARET_MARKER_${Date.now()}_${Math.random().toString(36).substr(2, 8)} -->`;
        const markerComment = document.createComment(marker);
        targetElement.parentNode.insertBefore(markerComment, targetElement);
        const htmlWithMarker = richEditor.innerHTML;
        const markerPos = htmlWithMarker.indexOf(marker);
        
        if (markerPos !== -1) {
          const beforeMarker = htmlWithMarker.substring(0, markerPos);
          const lineCount = (beforeMarker.match(/\n/g) || []).length;
          const targetLine = lineCount + 1;
          showLineIndicator(targetLine);
          // 只有需要滚动时才执行
          if (needScroll) scrollToLine(targetLine);
        } else {
          showLineIndicator(null);
        }

        markerComment.parentNode?.removeChild(markerComment);
        const newSelection = window.getSelection();
        newSelection.removeAllRanges();
        newSelection.addRange(savedRange);
      } catch (err) {
        showLineIndicator(null);
      } finally {
        isLocating = false;
      }
    }

    // ✅ 核心3：选区变化 → 只更新绿点，不滚动
    let selectionTimer = null;
    document.addEventListener('selectionchange', () => {
      if (selectionTimer) clearTimeout(selectionTimer);
      selectionTimer = setTimeout(() => {
        locateCurrentLine(false);
        const sel = window.getSelection();
        if (sel && sel.rangeCount > 0 && richEditor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
          const range = sel.getRangeAt(0);
          const line = range.startContainer.textContent?.substring(0, range.startOffset).split('\n').length || 1;
          cursorPosition.textContent = `行: ${line}, 列: ${range.startOffset % 80 || 1}`;
        } else {
          cursorPosition.textContent = `行: 1, 列: 1`;
        }
      }, 20);
    });

    // ✅ 核心4：【主动点击富文本】→ 执行一次滚动 + 绿点
    richEditor.addEventListener('click', () => {
      locateCurrentLine(true);
    });

    // 富文本编辑：只更新绿点，不滚动
    richEditor.addEventListener('input', () => {
      updatePreview();
      updateHtmlSource();
      updateStats();
      locateCurrentLine(false);
    });
    richEditor.addEventListener('keyup', () => { updateToolbarState(); locateCurrentLine(false); });

    // 源码区双向同步
    htmlSource.addEventListener('input', () => {
      richEditor.innerHTML = htmlSource.value;
      updatePreview();
      updateStats();
      updateCodeHighlight();
      updateLineNumbers();
      locateCurrentLine(false);
    });

    // 滚动同步
    htmlScrollContainer.addEventListener('scroll', () => {
      requestAnimationFrame(() => {
        codeHighlight.scrollTop = htmlScrollContainer.scrollTop;
        codeHighlight.scrollLeft = htmlScrollContainer.scrollLeft;
      });
    });

    // 工具栏事件
    toolbarBtns.forEach(btn => btn.addEventListener('click', () => execCommand(btn.getAttribute('data-command'))));
    headingSelect.addEventListener('change', () => {
      const val = headingSelect.value;
      execCommand('formatBlock', val ? `<${val}>` : '<p>');
    });
    linkBtn.addEventListener('click', () => {
      const url = prompt('请输入链接地址:', 'https://');
      if (url) execCommand('createLink', url);
    });
    imageBtn.addEventListener('click', () => {
      const url = prompt('请输入图片地址:', 'https://');
      if (url) execCommand('insertImage', url);
    });

    copyHtmlBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(richEditor.innerHTML); alert('HTML代码已复制到剪贴板'); }
      catch { alert('复制失败，请手动复制'); }
    });
    clearBtn.addEventListener('click', () => {
      if (confirm('清空所有内容？')) {
        richEditor.innerHTML = '<p>开始编辑...</p>';
        updatePreview();
        updateHtmlSource();
        updateStats();
        locateCurrentLine(true);
      }
    });

    // 面板缩放
    function initResizer(resizer, leftPanel, rightPanel) {
      let isResizing = false;
      resizer.addEventListener('mousedown', (e) => { isResizing = true; document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; e.preventDefault(); });
      document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const containerRect = document.querySelector('main').getBoundingClientRect();
        const totalWidth = containerRect.width;
        let mouseX = e.clientX - containerRect.left;
        let leftPercent = (mouseX / totalWidth) * 100;
        let rightPercent = 100 - leftPercent;
        if (leftPercent < 22 || rightPercent < 35) return;
        leftPanel.style.flex = `0 0 ${leftPercent}%`;
        rightPanel.style.flex = `0 0 ${rightPercent}%`;
      });
      document.addEventListener('mouseup', () => { isResizing = false; document.body.style.cursor = ''; document.body.style.userSelect = ''; });
    }
    initResizer(resizer1, previewPanel, editorPanel);
    initResizer(resizer2, editorPanel, htmlPanel);
    previewPanel.style.flex = '0 0 28%';
    editorPanel.style.flex = '0 0 24%';
    htmlPanel.style.flex = '0 0 48%';

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey) {
        if (e.key === 'b') { e.preventDefault(); execCommand('bold'); }
        else if (e.key === 'i') { e.preventDefault(); execCommand('italic'); }
        else if (e.key === 'u') { e.preventDefault(); execCommand('underline'); }
      }
    });
    
    richEditor.focus();
    setTimeout(() => locateCurrentLine(true), 100);
  </script>
</body>
</html>
