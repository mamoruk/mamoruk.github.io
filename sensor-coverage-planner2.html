<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>人在传感器覆盖规划器</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --border:#30363d;
    --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --green:#7ee787;
    --red:#ff6b6b; --orange:#ffae3b;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;font-size:13px;}
  header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  header h1{font-size:15px;margin:0;font-weight:600;}
  header .hint{color:var(--muted);font-size:12px;}
  .layout{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 52px);}
  .side{border-right:1px solid var(--border);padding:12px;overflow:auto;background:var(--panel);}
  .main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--border);overflow:hidden;}
  .view{background:var(--bg);position:relative;display:flex;flex-direction:column;min-height:0;}
  .view .vhead{padding:6px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .view .vbody{flex:1;min-height:0;position:relative;}
  svg{width:100%;height:100%;display:block;background:var(--bg);}
  #view3d{position:absolute;inset:0;}
  #view3d canvas{display:block;}
  #labelLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5;}
  .clabel{position:absolute;transform:translate(-50%,-130%);font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap;pointer-events:none;font-family:inherit;line-height:1.3;}
  .clabel.sensor{background:rgba(88,166,255,.16);border:1px solid rgba(88,166,255,.6);color:#cfe6ff;}
  .clabel.person{background:rgba(154,164,178,.16);border:1px solid rgba(154,164,178,.6);color:#d7dde6;}
  .clabel.sel{outline:1px solid var(--green);}
  .card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:12px;}
  .card h3{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  label{display:block;margin:6px 0 3px;color:var(--muted);}
  .row{display:flex;gap:6px;align-items:center;}
  input[type=number]{width:100%;background:#0d1117;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;}
  button{background:var(--accent);color:#06121f;border:none;border-radius:6px;padding:7px 10px;cursor:pointer;font-weight:600;font-size:12px;}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
  button.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  button:hover{filter:brightness(1.08);}
  .btns{display:flex;flex-wrap:wrap;gap:6px;}
  .chk{display:flex;align-items:center;gap:6px;margin:5px 0;cursor:pointer;}
  .chk input{accent-color:var(--accent);}
  .sensor-item{border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:8px;background:#0d1117;}
  .sensor-item.sel{border-color:var(--green);}
  .sensor-item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .sensor-item .top b{color:var(--green);}
  .stats{font-size:12px;line-height:1.7;}
  .stats .big{font-size:18px;font-weight:700;}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .swatch{width:14px;height:10px;border-radius:2px;display:inline-block;}
  .muted{color:var(--muted);}
  .tag{font-size:11px;padding:1px 6px;border-radius:10px;background:#0d1117;border:1px solid var(--border);}
  .kbd{font-family:ui-monospace,Consolas,monospace;background:#0d1117;border:1px solid var(--border);border-radius:4px;padding:0 4px;color:var(--accent);}
</style>
</head>
<body>
<header>
  <h1>人在传感器覆盖规划器</h1>
  <span class="hint">右键空白处弹出菜单：添加传感器 / 添加人物 · 左键拖拽移动传感器或人物 · 点列表或视图选中（3D 中可选中人物用 <span class="kbd">W A S D</span>/方向键移动，<span class="kbd">Shift</span> 加速）</span>
  <span class="legend">
    <span><i class="dot" style="background:var(--red)"></i>运动检测(直径14m@2.8m)</span>
    <span><i class="dot" style="background:var(--orange)"></i>存在检测(直径10m@2.8m)</span>
    <span><i class="swatch" style="background:rgba(255,60,60,.5)"></i>盲区</span>
  </span>
</header>

<div class="layout">
  <div class="side">
    <div class="card">
      <h3>房间尺寸 (米)</h3>
      <div class="row">
        <div style="flex:1"><label>长 L</label><input id="inL" type="number" min="0.1" step="0.1" value="10"></div>
        <div style="flex:1"><label>宽 W</label><input id="inW" type="number" min="0.1" step="0.1" value="8"></div>
        <div style="flex:1"><label>高 H</label><input id="inH" type="number" min="0.1" step="0.1" value="3"></div>
      </div>
      <div class="btns" style="margin-top:8px">
        <button id="btnApply">应用尺寸</button>
        <button class="ghost" id="btnFit">复位视图</button>
      </div>
    </div>

    <div class="card">
      <h3>图层</h3>
      <label class="chk"><input type="checkbox" id="ckMotion" checked> 运动检测范围</label>
      <label class="chk"><input type="checkbox" id="ckPresence" checked> 存在检测范围</label>
      <label class="chk"><input type="checkbox" id="ckBlind" checked> 盲区高亮</label>
      <label class="chk"><input type="checkbox" id="ck3DCones" checked> 3D 显示锥体</label>
      <label class="chk"><input type="checkbox" id="ckLabels" checked> 3D 坐标浮层</label>
    </div>

    <div class="card">
      <h3>操作</h3>
      <div class="btns">
        <button class="ghost" id="btnAdd">+ 添加传感器</button>
        <button class="ghost" id="btnAddPerson">+ 添加人物</button>
        <button class="danger" id="btnDel">删除选中</button>
        <button class="ghost" id="btnClear">清空</button>
      </div>
      <div class="btns" style="margin-top:6px">
        <button class="ghost" id="btnSave">保存JSON</button>
        <button class="ghost" id="btnLoad">载入JSON</button>
        <button class="ghost" id="btnTopPng">导出顶视图</button>
        <button class="ghost" id="btn3dPng">导出3D</button>
        <input id="fileInput" type="file" accept="application/json" style="display:none">
      </div>
    </div>

    <div class="card">
      <h3>覆盖率统计</h3>
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <h3>传感器列表 (<span id="sensorCount">0</span>)</h3>
      <div id="sensorList"></div>
    </div>

    <div class="card">
      <h3>人物 (<span id="personCount">0</span>)</h3>
      <div id="personList"></div>
    </div>
  </div>

  <div class="main">
    <div class="view">
      <div class="vhead"><span>顶视图 (俯视 · 地面投影)</span><span class="muted">滚轮缩放 · 拖背景平移</span></div>
      <div class="vbody"><svg id="topSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
    <div class="view">
      <div class="vhead"><span>3D 视图</span><span class="muted">左键旋转 · 滚轮缩放 · 右键平移 · 点选人物拖拽/ WASD 移动</span></div>
      <div class="vbody">
        <div id="view3d"></div>
        <div id="labelLayer"></div>
      </div>
    </div>
    <div class="view">
      <div class="vhead"><span>前视图 (沿宽方向看 · 锥体剖面)</span></div>
      <div class="vbody"><svg id="frontSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
    <div class="view">
      <div class="vhead"><span>侧视图 (沿长方向看 · 锥体剖面)</span></div>
      <div class="vbody"><svg id="sideSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
  </div>
</div>

<script src="libs/three.min.js"></script>
<script>
"use strict";
// ---------- 状态 ----------
const BASE_MOTION = 7;   // 半径(米) @2.8m
const BASE_PRESENCE = 5; // 半径(米) @2.8m
const REF_H = 2.8;

let L = 10, W = 8, H = 3;
let sensors = [];
let persons = [];
let uid = 1, uidP = 1;
const state = {
  showMotion:true, showPresence:true, showBlind:true, show3DCones:true, showLabels:true,
  selected:null, selectedPerson:null
};
const topView = { zoom:1, panX:0, panY:0 };

function radii(s){
  const k = s.mountH / REF_H;
  return { rm: s.motion ? BASE_MOTION*k : 0, rp: s.presence ? BASE_PRESENCE*k : 0, k };
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function getSensor(id){ return sensors.find(s=>s.id===id); }
function getPerson(id){ return persons.find(p=>p.id===id); }
// 计算地面点(px,py)被各传感器锥体从地面起算的覆盖高度
function scanHeights(px,py){
  let mH=0, pH=0;
  for(const s of sensors){
    const {rm,rp}=radii(s);
    const d=Math.hypot(px-s.x, py-s.y);
    if(rm>0 && d<=rm){ const hs=s.mountH*(1-d/rm); if(hs>mH) mH=hs; }
    if(rp>0 && d<=rp){ const hs=s.mountH*(1-d/rp); if(hs>pH) pH=hs; }
  }
  return {mH, pH};
}

// ---------- 渲染调度（rAF 合并，避免拖动时每帧全量重建） ----------
let _raf=null, _skipStats=false;
function requestRender(skipStats){
  _skipStats = _skipStats || !!skipStats;
  if(_raf) return;
  _raf = requestAnimationFrame(()=>{
    _raf=null;
    const skip=_skipStats; _skipStats=false;
    renderAll(skip);
  });
}

// ---------- 顶视图 ----------
const topSvg = document.getElementById('topSvg');
function computeTopFit(){
  const m = 1;
  let minX=0, maxX=L, minY=0, maxY=W;
  sensors.forEach(s=>{
    const {rm,rp} = radii(s); const r = Math.max(rm,rp);
    minX=Math.min(minX, s.x-r); maxX=Math.max(maxX, s.x+r);
    minY=Math.min(minY, s.y-r); maxY=Math.max(maxY, s.y+r);
  });
  return { x:minX-m, y:minY-m, w:(maxX-minX)+2*m, h:(maxY-minY)+2*m };
}
function applyTopViewBox(){
  const fit = computeTopFit();
  const w = fit.w / topView.zoom, h = fit.h / topView.zoom;
  const cx = fit.x + fit.w/2 + topView.panX;
  const cy = fit.y + fit.h/2 + topView.panY;
  topSvg.setAttribute('viewBox', `${cx-w/2} ${cy-h/2} ${w} ${h}`);
}
function renderTop(){
  let s = `<rect x="0" y="0" width="${L}" height="${W}" fill="#11161d" stroke="#3a4452" stroke-width="0.04"/>`;
  let defs = '<defs>';
  if(state.showBlind && state.showMotion){
    defs += `<mask id="bm"><rect x="0" y="0" width="${L}" height="${W}" fill="white"/>`;
    sensors.forEach(se=>{ const r=radii(se).rm; if(r>0) defs+=`<circle cx="${se.x}" cy="${se.y}" r="${r}" fill="black"/>`; });
    defs += '</mask>';
  }
  if(state.showBlind && state.showPresence){
    defs += `<mask id="bp"><rect x="0" y="0" width="${L}" height="${W}" fill="white"/>`;
    sensors.forEach(se=>{ const r=radii(se).rp; if(r>0) defs+=`<circle cx="${se.x}" cy="${se.y}" r="${r}" fill="black"/>`; });
    defs += '</mask>';
  }
  defs += '</defs>';
  s += defs;
  if(state.showBlind && state.showMotion) s+=`<rect x="0" y="0" width="${L}" height="${W}" fill="rgba(255,60,60,0.30)" mask="url(#bm)"/>`;
  if(state.showBlind && state.showPresence) s+=`<rect x="0" y="0" width="${L}" height="${W}" fill="rgba(255,150,40,0.32)" mask="url(#bp)"/>`;
  sensors.forEach(se=>{
    const {rm,rp}=radii(se);
    if(state.showMotion && rm>0) s+=`<circle cx="${se.x}" cy="${se.y}" r="${rm}" fill="rgba(255,80,80,0.05)" stroke="#ff6b6b" stroke-width="0.03" stroke-dasharray="0.18 0.12"/>`;
    if(state.showPresence && rp>0) s+=`<circle cx="${se.x}" cy="${se.y}" r="${rp}" fill="rgba(255,170,60,0.07)" stroke="#ffae3b" stroke-width="0.03"/>`;
  });
  sensors.forEach(se=>{
    const sel = se.id===state.selected;
    s+=`<circle data-sensor-id="${se.id}" cx="${se.x}" cy="${se.y}" r="${sel?0.28:0.18}" fill="${sel?'#7ee787':'#58a6ff'}" stroke="#fff" stroke-width="0.02" style="cursor:pointer"/>`;
    s+=`<text x="${se.x}" y="${se.y-0.38}" font-size="0.22" fill="#c9d1d9" text-anchor="middle">S${se.id}</text>`;
    s+=`<text x="${se.x}" y="${se.y-0.6}" font-size="0.15" fill="#6b7682" text-anchor="middle">(${se.x.toFixed(1)}, ${se.y.toFixed(1)})</text>`;
  });
  // 人物：顶视图以单个点表示位置
  persons.forEach(p=>{
    const sc=scanHeights(p.x,p.y);
    const col = (sc.mH>=p.height)? '#2ea043' : (sc.mH>0? '#ffae3b' : '#ff6b6b');
    const sel = p.id===state.selectedPerson;
    s+=`<g data-person-id="${p.id}" style="cursor:pointer">
      <circle cx="${p.x}" cy="${p.y}" r="${sel?0.18:0.13}" fill="${col}" stroke="#fff" stroke-width="0.02"/>
      <text x="${p.x}" y="${p.y+0.38}" font-size="0.18" fill="#c9d1d9" text-anchor="middle">人${p.id}</text>
    </g>`;
  });
  // 选中实体的离墙标注（青色虚线 + 距离文字）
  const selEnt = state.selected!=null ? getSensor(state.selected)
              : (state.selectedPerson!=null ? getPerson(state.selectedPerson) : null);
  if(selEnt){
    const x=selEnt.x, y=selEnt.y;
    const dl=(x0,y0,x1,y1,label)=>{
      s+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#39d0d8" stroke-width="0.02" stroke-dasharray="0.1 0.07"/>`;
      s+=`<text x="${(x0+x1)/2}" y="${(y0+y1)/2 - 0.13}" font-size="0.17" fill="#39d0d8" text-anchor="middle">${label}</text>`;
    };
    dl(0, y, x, y, `左 ${x.toFixed(1)}`);
    dl(x, y, L, y, `右 ${(L-x).toFixed(1)}`);
    dl(x, 0, x, y, `前 ${y.toFixed(1)}`);
    dl(x, y, x, W, `后 ${(W-y).toFixed(1)}`);
  }
  topSvg.innerHTML = s;
  applyTopViewBox();
}

// 顶视图坐标转换
function toMeter(evt){
  const pt = topSvg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const ctm = topSvg.getScreenCTM();
  const p = pt.matrixTransform(ctm.inverse());
  return { x:p.x, y:p.y };
}
let drag = null;
topSvg.addEventListener('mousedown', e=>{
  if(e.button!==0) return; // 仅左键拖拽；右键交给上下文菜单
  const pt = toMeter(e);
  const pe = e.target.closest('[data-person-id]');
  const se = e.target.closest('[data-sensor-id]');
  if(pe){
    const p = getPerson(+pe.dataset.personId);
    if(p) drag = { pid:p.id, moved:false, sx:e.clientX, sy:e.clientY, gdx:p.x-pt.x, gdy:p.y-pt.y };
  } else if(se){
    const s = getSensor(+se.dataset.sensorId);
    if(s) drag = { id:s.id, moved:false, sx:e.clientX, sy:e.clientY, gdx:s.x-pt.x, gdy:s.y-pt.y };
  } else {
    drag = { bg:true, moved:false, sx:e.clientX, sy:e.clientY, panX:topView.panX, panY:topView.panY };
  }
});
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  if(drag.pid!=null){
    const pt = toMeter(e);
    const p = getPerson(drag.pid);
    if(p){ p.x = clamp(pt.x+drag.gdx,0,L); p.y = clamp(pt.y+drag.gdy,0,W); drag.moved=true; requestRender(true); }
  } else if(drag.id!=null){
    const pt = toMeter(e);
    const s = getSensor(drag.id);
    if(s){ s.x = clamp(pt.x+drag.gdx,0,L); s.y = clamp(pt.y+drag.gdy,0,W); drag.moved=true; requestRender(true); }
  } else if(drag.bg){
    const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
    const vbw = parseFloat(topSvg.getAttribute('viewBox').split(' ')[2]);
    const scale = vbw / topSvg.clientWidth;
    topView.panX = drag.panX - dx*scale;
    topView.panY = drag.panY + dy*scale;
    if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
    applyTopViewBox();
  }
});
window.addEventListener('mouseup', e=>{
  if(!drag) return;
  if(drag.pid!=null && !drag.moved){ state.selectedPerson=drag.pid; state.selected=null; renderAll(); }
  else if(drag.id!=null && !drag.moved){ state.selected=drag.id; state.selectedPerson=null; renderAll(); }
  else if(drag.bg && !drag.moved){ state.selected=null; state.selectedPerson=null; renderAll(); }
  drag=null;
});
// ---------- 右键上下文菜单 ----------
const ctxMenu = document.createElement('div');
ctxMenu.id='ctxMenu';
ctxMenu.style.cssText='position:fixed;z-index:50;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:4px;min-width:150px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13px;';
document.body.appendChild(ctxMenu);
function showCtx(e, items){
  ctxMenu.innerHTML='';
  items.forEach(it=>{
    const d=document.createElement('div');
    d.textContent=it.label;
    d.style.cssText='padding:7px 12px;cursor:pointer;border-radius:6px;color:'+(it.danger?'#ff6b6b':'#c9d1d9')+';white-space:nowrap;';
    d.onmouseenter=()=>d.style.background='#21262d';
    d.onmouseleave=()=>d.style.background='transparent';
    d.onclick=()=>{ hideCtx(); it.action(); };
    ctxMenu.appendChild(d);
  });
  ctxMenu.style.display='block';
  ctxMenu.style.left=Math.min(e.clientX, window.innerWidth-170)+'px';
  ctxMenu.style.top=Math.min(e.clientY, window.innerHeight-(items.length*32+12))+'px';
}
function hideCtx(){ ctxMenu.style.display='none'; }
window.addEventListener('mousedown', e=>{ if(!ctxMenu.contains(e.target)) hideCtx(); }, true);
function attachCtx(svg, horiz){
  svg.addEventListener('contextmenu', e=>{
    e.preventDefault();
    const pe=e.target.closest('[data-person-id]');
    const se=e.target.closest('[data-sensor-id]');
    const items=[];
    if(se){
      const id=+se.dataset.sensorId;
      items.push({label:'选中传感器 S'+id, action:()=>{ state.selected=id; state.selectedPerson=null; renderAll(); }});
      items.push({label:'删除传感器 S'+id, danger:true, action:()=>{ sensors=sensors.filter(s=>s.id!==id); if(state.selected===id) state.selected=null; renderAll(); }});
    } else if(pe){
      const id=+pe.dataset.personId;
      items.push({label:'选人 人'+id, action:()=>{ state.selectedPerson=id; state.selected=null; renderAll(); }});
      items.push({label:'删除人物 人'+id, danger:true, action:()=>{ persons=persons.filter(p=>p.id!==id); if(state.selectedPerson===id) state.selectedPerson=null; renderAll(); }});
    } else {
      let x, y;
      if(horiz==='top'){ const pt=toMeter(e); x=clamp(pt.x,0,L); y=clamp(pt.y,0,W); }
      else if(horiz==='x'){ x=clamp(elevToMeter(svg,e),0,L); y=W/2; }
      else { y=clamp(elevToMeter(svg,e),0,W); x=L/2; }
      items.push({label:'➕ 添加传感器', action:()=>addSensorAt(x,y)});
      items.push({label:'➕ 添加人物', action:()=>addPersonAt(x,y)});
    }
    showCtx(e, items);
  });
}
attachCtx(topSvg,'top');
attachCtx(document.getElementById('frontSvg'),'x');
attachCtx(document.getElementById('sideSvg'),'y');
topSvg.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = e.deltaY>0 ? 1.1 : 0.9;
  topView.zoom = clamp(topView.zoom*f, 0.2, 8);
  applyTopViewBox();
}, {passive:false});

function addSensorAt(x,y){
  x=clamp(x,0,L); y=clamp(y,0,W);
  const s={ id:uid++, x, y, mountH:2.8, motion:true, presence:true };
  sensors.push(s); state.selected=s.id; state.selectedPerson=null; renderAll();
}
function addPersonAt(x,y){
  x=clamp(x,0,L); y=clamp(y,0,W);
  const p={ id:uidP++, x, y, height:1.7, heading:0 };
  persons.push(p); state.selectedPerson=p.id; state.selected=null; renderAll();
}

// ---------- 立面视图 (前/侧) ----------
function renderElevation(svg, horiz){
  const wMax = horiz==='x' ? L : W;
  let minX=0, maxX=wMax;
  sensors.forEach(s=>{
    const {rm,rp}=radii(s); const r=Math.max(rm,rp);
    const c = horiz==='x' ? s.x : s.y;
    minX=Math.min(minX, c-r); maxX=Math.max(maxX, c+r);
  });
  const m=1;
  const vbX=minX-m, vbW=(maxX-minX)+2*m, vbY=-m, vbH=H+2*m;
  let s='';
  s+=`<rect x="${vbX}" y="${vbY}" width="${vbW}" height="${vbH}" fill="#11161d"/>`;
  s+=`<rect x="0" y="0" width="${wMax}" height="${H}" fill="none" stroke="#3a4452" stroke-width="0.03"/>`;
  s+=`<line x1="0" y1="${H}" x2="${wMax}" y2="${H}" stroke="#586069" stroke-width="0.04"/>`;
  s+=`<line x1="0" y1="0" x2="${wMax}" y2="0" stroke="#2a3038" stroke-width="0.02" stroke-dasharray="0.1 0.08"/>`;
  sensors.forEach(se=>{
    const c = horiz==='x' ? se.x : se.y;
    const {rm,rp}=radii(se);
    const apexY = H - se.mountH;
    if(state.showMotion && rm>0){
      s+=`<polygon points="${c-rm},${H} ${c+rm},${H} ${c},${apexY}" fill="rgba(255,80,80,0.07)" stroke="#ff6b6b" stroke-width="0.025" stroke-dasharray="0.15 0.1"/>`;
    }
    if(state.showPresence && rp>0){
      s+=`<polygon points="${c-rp},${H} ${c+rp},${H} ${c},${apexY}" fill="rgba(255,170,60,0.09)" stroke="#ffae3b" stroke-width="0.025"/>`;
    }
    const sel = se.id===state.selected;
    s+=`<circle data-sensor-id="${se.id}" cx="${c}" cy="${apexY}" r="${sel?0.18:0.12}" fill="${sel?'#7ee787':'#58a6ff'}" stroke="#fff" stroke-width="0.015" style="cursor:pointer"/>`;
    s+=`<text x="${c}" y="${apexY-0.3}" font-size="0.2" fill="#c9d1d9" text-anchor="middle">S${se.id}</text>`;
  });
  // 人物（前/侧视图：正常人体结构比例模型 + 扫描覆盖段）
  persons.forEach(p=>{
    const c = horiz==='x' ? p.x : p.y;
    const h = p.height;
    const sc=scanHeights(p.x,p.y);
    const col = (sc.mH>=h)? '#2ea043' : (sc.mH>0? '#ffae3b' : '#ff6b6b');
    const feetY=H, headTopY=H-h;
    const shY=H-h*0.82, hipY=H-h*0.50, headCy=H-h*0.90, headR=h*0.07;
    const sw=h*0.13, legSpread=h*0.10, armLen=h*0.22;
    s+=`<g data-person-id="${p.id}" style="cursor:pointer">`;
    // 腿
    s+=`<line x1="${c}" y1="${hipY}" x2="${c-legSpread}" y2="${feetY}" stroke="${col}" stroke-width="0.045" stroke-linecap="round"/>`;
    s+=`<line x1="${c}" y1="${hipY}" x2="${c+legSpread}" y2="${feetY}" stroke="${col}" stroke-width="0.045" stroke-linecap="round"/>`;
    // 躯干
    s+=`<line x1="${c}" y1="${hipY}" x2="${c}" y2="${shY}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>`;
    // 手臂
    s+=`<line x1="${c}" y1="${shY+h*0.02}" x2="${c-armLen}" y2="${H-h*0.45}" stroke="${col}" stroke-width="0.04" stroke-linecap="round"/>`;
    s+=`<line x1="${c}" y1="${shY+h*0.02}" x2="${c+armLen}" y2="${H-h*0.45}" stroke="${col}" stroke-width="0.04" stroke-linecap="round"/>`;
    // 头
    s+=`<circle cx="${c}" cy="${headCy}" r="${headR}" fill="${col}"/>`;
    // 从地面起的运动/存在扫描覆盖段
    if(sc.mH>0){ const my=H-Math.min(h,sc.mH); s+=`<rect x="${c-sw/2}" y="${my}" width="${sw}" height="${(H-my).toFixed(3)}" fill="rgba(46,160,67,0.30)"/>`; }
    if(state.showPresence && sc.pH>0){ const py=H-Math.min(h,sc.pH); s+=`<line x1="${c-sw/2-0.015}" y1="${py}" x2="${c+sw/2+0.015}" y2="${py}" stroke="#ffae3b" stroke-width="0.02"/>`; }
    s+=`<text x="${c}" y="${headTopY-0.12}" font-size="0.18" fill="#c9d1d9" text-anchor="middle">人${p.id}</text>`;
    s+=`</g>`;
  });
  svg.setAttribute('viewBox', `${vbX} ${vbY} ${vbW} ${vbH}`);
  svg.innerHTML = s;
}
function renderFront(){ renderElevation(document.getElementById('frontSvg'),'x'); }
function renderSide(){ renderElevation(document.getElementById('sideSvg'),'y'); }

// 前/侧视图拖拽：只改与水平轴对应的坐标（前视图改 X，侧视图改 Y）
function elevToMeter(svg, evt){
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const ctm = svg.getScreenCTM();
  const p = pt.matrixTransform(ctm.inverse());
  return p.x; // viewBox 水平坐标即世界水平轴(米)
}
function setupElevDrag(svg, horiz){
  let drag = null;
  svg.addEventListener('mousedown', e=>{
    if(e.button!==0) return;
    const pe=e.target.closest('[data-person-id]');
    const se=e.target.closest('[data-sensor-id]');
    if(pe){
      const p=getPerson(+pe.dataset.personId);
      if(p){ const cur = horiz==='x'? p.x : p.y; const val=elevToMeter(svg,e); drag={ pid:p.id, moved:false, sx:e.clientX, sy:e.clientY, gd:cur-val }; }
    } else if(se){
      const s=getSensor(+se.dataset.sensorId);
      if(s){ const cur = horiz==='x'? s.x : s.y; const val=elevToMeter(svg,e); drag={ id:s.id, moved:false, sx:e.clientX, sy:e.clientY, gd:cur-val }; }
    } else { drag={ bg:true }; }
  });
  window.addEventListener('mousemove', e=>{
    if(!drag || drag.bg) return;
    const val = elevToMeter(svg, e) + drag.gd;
    const lim = horiz==='x' ? L : W;
    if(drag.pid!=null){
      const p = getPerson(drag.pid);
      if(p){ if(horiz==='x') p.x = clamp(val,0,L); else p.y = clamp(val,0,W); drag.moved=true; requestRender(true); }
    } else if(drag.id!=null){
      const s = getSensor(drag.id);
      if(s){ if(horiz==='x') s.x = clamp(val,0,L); else s.y = clamp(val,0,W); drag.moved=true; requestRender(true); }
    }
  });
  window.addEventListener('mouseup', ()=>{
    if(!drag) return;
    if(drag.bg){ state.selected=null; state.selectedPerson=null; renderAll(); }
    else if(!drag.moved){
      if(drag.pid!=null){ state.selectedPerson=drag.pid; state.selected=null; }
      else { state.selected=drag.id; state.selectedPerson=null; }
      renderAll();
    }
    drag=null;
  });
}

// ---------- 3D ----------
let scene, camera, renderer, controls, roomGroup, sensorGroup;
let sensorObjs = new Map();   // id -> {group, sphere, coneM, coneP}
let personObjs = new Map();   // id -> {group, envM, envP}
let sensorLabelDivs = new Map();
let personLabelDivs = new Map();

// 轻量自实现轨道控制（避免外部 CDN 依赖）
function makeControls(camera, dom){
  const c = { target:new THREE.Vector3(), update(){}, enableDamping:true, enabled:true };
  const sph = new THREE.Spherical();
  let dragging=false, mode=null, lx=0, ly=0;
  function sync(){ const off=camera.position.clone().sub(c.target); sph.setFromVector3(off); }
  dom.addEventListener('contextmenu', e=>e.preventDefault());
  dom.addEventListener('mousedown', e=>{ if(!c.enabled) return; dragging=true; mode=(e.button===2||e.button===1)?'pan':'rotate'; lx=e.clientX; ly=e.clientY; sync(); });
  window.addEventListener('mouseup', ()=>{ dragging=false; });
  window.addEventListener('mousemove', e=>{
    if(!c.enabled || !dragging) return;
    const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    if(mode==='rotate'){
      sph.theta -= dx*0.005;
      sph.phi = Math.max(0.05, Math.min(Math.PI-0.05, sph.phi - dy*0.005));
    } else {
      const k = sph.radius*0.0015;
      const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
      const right = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
      const upv = camera.up.clone();
      c.target.add(right.clone().multiplyScalar(-dx*k)).add(upv.clone().multiplyScalar(dy*k));
      camera.position.add(right.clone().multiplyScalar(-dx*k)).add(upv.clone().multiplyScalar(dy*k));
      sync();
    }
    const off = new THREE.Vector3().setFromSpherical(sph);
    camera.position.copy(c.target).add(off);
    camera.lookAt(c.target);
  });
  dom.addEventListener('wheel', e=>{
    if(!c.enabled) return;
    e.preventDefault();
    sync();
    sph.radius *= (e.deltaY>0 ? 1.1 : 0.9);
    sph.radius = Math.max(0.5, Math.min(800, sph.radius));
    const off = new THREE.Vector3().setFromSpherical(sph);
    camera.position.copy(c.target).add(off);
    camera.lookAt(c.target);
  }, {passive:false});
  return c;
}

function cylinderBetween(p1,p2,r,mat){
  const dir = new THREE.Vector3().subVectors(p2,p1);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(r,r,len,10);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  return mesh;
}

// 真实比例人体模型（含骨架/肢体结构，单位身高 1m，整体按身高缩放）
function createPerson3D(p){
  const group=new THREE.Group(); group.userData.pid=p.id;
  const matBody=new THREE.MeshBasicMaterial({color:0x9aa4b2});
  const P=(x,y,z)=>new THREE.Vector3(x,y,z);
  const armR=0.035, legR=0.05;
  function limb(a,b,r){ const m=cylinderBetween(a,b,r,matBody); m.userData.body=true; group.add(m); return m; }
  // 躯干
  const torso=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.34,0.11), matBody);
  torso.position.set(0,(0.84+0.52)/2,0); torso.userData.body=true; group.add(torso);
  // 颈
  limb(P(0,0.84,0),P(0,0.90,0),0.045);
  // 头
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.075,16,16), matBody); head.position.set(0,0.95,0); head.userData.body=true; group.add(head);
  // 手臂（上臂 + 前臂）
  limb(P(-0.09,0.84,0),P(-0.20,0.62,0.02),armR);
  limb(P(-0.20,0.62,0.02),P(-0.22,0.42,0.05),armR);
  limb(P(0.09,0.84,0),P(0.20,0.62,0.02),armR);
  limb(P(0.20,0.62,0.02),P(0.22,0.42,0.05),armR);
  // 手
  [[-0.22,0.42,0.05],[0.22,0.42,0.05]].forEach(c=>{ const h=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,8),matBody); h.position.set(c[0],c[1],c[2]); h.userData.body=true; group.add(h); });
  // 腿（大腿 + 小腿）
  limb(P(-0.05,0.52,0),P(-0.06,0.27,0.03),legR);
  limb(P(-0.06,0.27,0.03),P(-0.06,0.04,0),legR);
  limb(P(0.05,0.52,0),P(0.06,0.27,0.03),legR);
  limb(P(0.06,0.27,0.03),P(0.06,0.04,0),legR);
  // 脚
  [[-0.06,0.02,0.06],[0.06,0.02,0.06]].forEach(c=>{ const f=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.04,0.16),matBody); f.position.set(c[0],c[1],c[2]); f.userData.body=true; group.add(f); });
  sensorGroup.add(group);
  // 扫描范围包膜（运动=绿、存在=橙，单位高度 1，按需缩放）
  const envM=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,1,24,1,true), new THREE.MeshBasicMaterial({color:0x2ea043,transparent:true,opacity:0.18,depthWrite:false}));
  const envP=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.30,1,24,1,true), new THREE.MeshBasicMaterial({color:0xffae3b,transparent:true,opacity:0.18,depthWrite:false}));
  envM.userData.pid=p.id; envP.userData.pid=p.id;
  sensorGroup.add(envM); sensorGroup.add(envP);
  return {group, envM, envP};
}

function createSensor3D(se){
  const group=new THREE.Group(); group.userData.sid=se.id;
  const sph=new THREE.Mesh(new THREE.SphereGeometry(0.12,16,16), new THREE.MeshBasicMaterial({color:0x58a6ff}));
  sph.userData.sid=se.id; group.add(sph);
  const coneM=new THREE.Mesh(new THREE.ConeGeometry(1,1,48,1,true), new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.16,side:THREE.DoubleSide,depthWrite:false}));
  coneM.userData.sid=se.id; group.add(coneM);
  const coneP=new THREE.Mesh(new THREE.ConeGeometry(1,1,48,1,true), new THREE.MeshBasicMaterial({color:0xffae3b,transparent:true,opacity:0.16,side:THREE.DoubleSide,depthWrite:false}));
  coneP.userData.sid=se.id; group.add(coneP);
  sensorGroup.add(group);
  return {group, sphere:sph, coneM, coneP};
}

function updateCone(mesh, se, r, color){
  const show = state.show3DCones && r>0;
  mesh.visible = show;
  if(!show) return;
  if(mesh.userData.lastR!==r || mesh.userData.lastH!==se.mountH){
    mesh.geometry.dispose();
    mesh.geometry = new THREE.ConeGeometry(r, se.mountH, 48,1,true);
    mesh.userData.lastR=r; mesh.userData.lastH=se.mountH;
  }
  mesh.position.set(se.x, se.mountH/2, se.y);
  mesh.material.color.setHex(color);
}

function disposeObj(obj){
  obj.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){ if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose()); else o.material.dispose(); }
  });
}

// 增量同步 3D 对象（拖动时只更新位置，不重建几何，保证流畅）
function sync3D(){
  if(!sensorGroup) return;
  // 传感器
  sensors.forEach(se=>{
    let o=sensorObjs.get(se.id);
    if(!o){ o=createSensor3D(se); sensorObjs.set(se.id,o); }
    o.sphere.position.set(se.x, se.mountH, se.y);
    o.sphere.material.color.setHex(se.id===state.selected?0x7ee787:0x58a6ff);
    const {rm,rp}=radii(se);
    updateCone(o.coneM, se, rm, 0xff6b6b);
    updateCone(o.coneP, se, rp, 0xffae3b);
  });
  sensorObjs.forEach((o,id)=>{
    if(!sensors.find(s=>s.id===id)){ disposeObj(o.group); sensorGroup.remove(o.group); sensorObjs.delete(id); }
  });
  // 人物
  persons.forEach(p=>{
    let o=personObjs.get(p.id);
    if(!o){ o=createPerson3D(p); personObjs.set(p.id,o); }
    o.group.position.set(p.x,0,p.y);
    o.group.scale.setScalar(p.height);
    o.group.rotation.y = p.heading||0;
    o.group.traverse(m=>{ if(m.isMesh && m.userData.body) m.material.color.setHex(p.id===state.selectedPerson?0x7ee787:0x9aa4b2); });
    const sc=scanHeights(p.x,p.y);
    const mh=Math.min(p.height, sc.mH), ph=Math.min(p.height, sc.pH);
    o.envM.visible = state.showMotion && mh>0.001;
    o.envP.visible = state.showPresence && ph>0.001;
    o.envM.scale.y = Math.max(0.001,mh); o.envM.position.set(p.x, mh/2, p.y);
    o.envP.scale.y = Math.max(0.001,ph); o.envP.position.set(p.x, ph/2, p.y);
  });
  personObjs.forEach((o,id)=>{
    if(!persons.find(p=>p.id===id)){
      disposeObj(o.group); disposeObj(o.envM); disposeObj(o.envP);
      sensorGroup.remove(o.group); sensorGroup.remove(o.envM); sensorGroup.remove(o.envP);
      personObjs.delete(id);
    }
  });
}

function init3D(){
  const cont = document.getElementById('view3d');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);
  camera = new THREE.PerspectiveCamera(50, cont.clientWidth/cont.clientHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
  renderer.setSize(cont.clientWidth, cont.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  cont.appendChild(renderer.domElement);
  controls = makeControls(camera, renderer.domElement);
  if(window.ResizeObserver){
    const ro = new ResizeObserver(()=>onResize());
    ro.observe(cont);
  }
  scene.add(new THREE.AmbientLight(0xffffff, 0.85));
  const dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.set(1,2,1); scene.add(dl);
  roomGroup = new THREE.Group(); scene.add(roomGroup);
  sensorGroup = new THREE.Group(); scene.add(sensorGroup);
  buildRoom();
  fitCamera();
  window.addEventListener('resize', onResize);
  setupPersonDrag3D();
  animate();
}
function onResize(){
  const cont = document.getElementById('view3d');
  camera.aspect = cont.clientWidth/cont.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(cont.clientWidth, cont.clientHeight);
}
function buildRoom(){
  while(roomGroup.children.length) roomGroup.remove(roomGroup.children[0]);
  const box = new THREE.BoxGeometry(L,H,W);
  const edges = new THREE.EdgesGeometry(box);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color:0x3a4452}));
  line.position.set(L/2, H/2, W/2);
  roomGroup.add(line);
  const gs = Math.max(L,W);
  const grid = new THREE.GridHelper(gs, Math.ceil(gs), 0x2a3340, 0x20262e);
  grid.position.set(L/2, 0.001, W/2);
  roomGroup.add(grid);
  const axes = new THREE.AxesHelper(Math.min(L,W,H)*0.4);
  roomGroup.add(axes);
}
function fitCamera(){
  const c = new THREE.Vector3(L/2, H/2, W/2);
  controls.target.copy(c);
  const d = Math.max(L,W,H);
  camera.position.set(L/2 + d*0.9, H + d*0.7, W/2 + d*0.9);
  camera.lookAt(c);
  controls.update();
}

// ---------- 3D 中人物点选 + 拖拽 ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let drag3D = null;
function setNDC(e){
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX-rect.left)/rect.width)*2-1;
  ndc.y = -((e.clientY-rect.top)/rect.height)*2+1;
}
function setupPersonDrag3D(){
  renderer.domElement.addEventListener('mousedown', e=>{
    if(e.button!==0) return; // 仅左键点选人物
    setNDC(e); raycaster.setFromCamera(ndc, camera);
    const meshes=[]; personObjs.forEach(o=>o.group.traverse(m=>{ if(m.isMesh) meshes.push(m); }));
    const hits = raycaster.intersectObjects(meshes, false);
    if(hits.length){
      let obj=hits[0].object; while(obj && obj.userData.pid===undefined) obj=obj.parent;
      if(obj){
        const pid=obj.userData.pid;
        state.selectedPerson=pid; state.selected=null;
        drag3D={pid}; if(controls) controls.enabled=false;
        renderAll();
      }
    }
  });
  window.addEventListener('mousemove', e=>{
    if(!drag3D) return;
    setNDC(e); raycaster.setFromCamera(ndc, camera);
    const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
    const pt=new THREE.Vector3();
    if(raycaster.ray.intersectPlane(plane, pt)){
      const p=getPerson(drag3D.pid);
      if(p){ p.x=clamp(pt.x,0,L); p.y=clamp(pt.z,0,W); requestRender(true); }
    }
  });
  window.addEventListener('mouseup', ()=>{
    if(drag3D){ drag3D=null; if(controls) controls.enabled=true; renderAll(); }
  });
}

// ---------- 坐标浮层 ----------
function syncLabelPool(){
  const layer=document.getElementById('labelLayer');
  const want = sensors.length + persons.length;
  while(layer.children.length < want){ const d=document.createElement('div'); d.className='clabel'; layer.appendChild(d); }
  while(layer.children.length > want){ layer.removeChild(layer.lastChild); }
  sensorLabelDivs.clear(); personLabelDivs.clear();
  let i=0;
  sensors.forEach(s=>{ const d=layer.children[i++]; d.className='clabel sensor'+(s.id===state.selected?' sel':''); sensorLabelDivs.set(s.id,d); });
  persons.forEach(p=>{ const d=layer.children[i++]; d.className='clabel person'+(p.id===state.selectedPerson?' sel':''); personLabelDivs.set(p.id,d); });
}
function updateLabelPositions(){
  if(state.showLabels===false){ document.getElementById('labelLayer').style.display='none'; return; }
  document.getElementById('labelLayer').style.display='block';
  const cont=document.getElementById('view3d');
  const w=cont.clientWidth, h=cont.clientHeight;
  const place=(d, x,y,z)=>{
    const v=new THREE.Vector3(x,y,z); v.project(camera);
    if(v.z>1){ d.style.display='none'; return; }
    d.style.display='block';
    d.style.left=((v.x*0.5+0.5)*w)+'px';
    d.style.top=((-v.y*0.5+0.5)*h)+'px';
  };
  sensorLabelDivs.forEach((d,id)=>{
    const s=sensors.find(x=>x.id===id); if(!s) return;
    d.textContent=`S${id}  X:${s.x.toFixed(1)} Y:${s.mountH.toFixed(1)} Z:${s.y.toFixed(1)}`;
    place(d, s.x, s.mountH, s.y);
  });
  personLabelDivs.forEach((d,id)=>{
    const p=persons.find(x=>x.id===id); if(!p) return;
    d.textContent=`人${id}  (${p.x.toFixed(1)}, ${p.y.toFixed(1)})`;
    place(d, p.x, p.height+0.25, p.y);
  });
}

// ---------- 键盘移动人物 ----------
const keys={};
window.addEventListener('keydown', e=>{
  const k=e.key.toLowerCase(); keys[k]=true;
  if(state.selectedPerson!=null && ['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', e=>{
  const k=e.key.toLowerCase(); keys[k]=false;
  if(state.selectedPerson!=null && ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
    renderAll(); // 停止移动后刷新统计/列表
  }
});
function handleKeyboard(dt){
  if(state.selectedPerson==null) return;
  const p=getPerson(state.selectedPerson); if(!p) return;
  let mx=0, mz=0; const sp=(keys['shift']?4:2)*dt;
  if(keys['w']||keys['arrowup']) mz-=1;
  if(keys['s']||keys['arrowdown']) mz+=1;
  if(keys['a']||keys['arrowleft']) mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  if(mx||mz){
    const len=Math.hypot(mx,mz); mx/=len; mz/=len;
    p.x=clamp(p.x+mx*sp,0,L);
    p.y=clamp(p.y+mz*sp,0,W);
    p.heading=Math.atan2(mx,mz);
    requestRender(true);
  }
}

let lastT=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(); const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  handleKeyboard(dt);
  if(controls) controls.update();
  if(renderer) renderer.render(scene,camera);
  if(camera) updateLabelPositions();
}

// ---------- 统计 ----------
function coverage(layer){
  if(sensors.length===0) return 0;
  const step = Math.max(0.2, Math.min(L,W)/150);
  let total=0, covered=0;
  for(let x=0;x<=L+1e-9;x+=step){
    for(let y=0;y<=W+1e-9;y+=step){
      total++;
      let inside=false;
      for(const s of sensors){
        const r = layer==='motion'? radii(s).rm : radii(s).rp;
        if(r>0){
          const dx=x-s.x, dy=y-s.y;
          if(dx*dx+dy*dy <= r*r){ inside=true; break; }
        }
      }
      if(inside) covered++;
    }
  }
  return covered/total;
}
function updateStats(){
  const cm = coverage('motion'), cp = coverage('presence');
  document.getElementById('stats').innerHTML =
    `<div>传感器数量：<b>${sensors.length}</b></div>`+
    `<div>运动层覆盖率：<span class="big" style="color:var(--red)">${(cm*100).toFixed(1)}%</span></div>`+
    `<div>存在层覆盖率：<span class="big" style="color:var(--orange)">${(cp*100).toFixed(1)}%</span></div>`+
    (sensors.length? `<div class="muted" style="margin-top:6px">挂高 2.8m 时：运动半径 ${BASE_MOTION}m / 存在半径 ${BASE_PRESENCE}m；</div>`+
      `<div class="muted">当前挂高比例已按各传感器挂高自动缩放。</div>` : '');
}

// ---------- 列表 ----------
function renderList(){
  document.getElementById('sensorCount').textContent = sensors.length;
  const box = document.getElementById('sensorList');
  if(sensors.length===0){ box.innerHTML='<div class="muted">暂无传感器</div>'; return; }
  box.innerHTML = sensors.map(s=>{
    const sel = s.id===state.selected;
    return `<div class="sensor-item ${sel?'sel':''}" data-list-id="${s.id}">
      <div class="top"><b>S${s.id}</b>
        <button class="danger" data-del="${s.id}" style="padding:2px 8px">删</button></div>
      <label class="chk"><input type="checkbox" data-m="${s.id}" ${s.motion?'checked':''}> 运动</label>
      <label class="chk"><input type="checkbox" data-p="${s.id}" ${s.presence?'checked':''}> 存在</label>
      <div class="row" style="margin-top:4px;gap:6px">
        <span class="muted" style="width:auto">X</span><input type="number" step="0.1" value="${s.x.toFixed(2)}" data-sx="${s.id}" style="width:58px">
        <span class="muted" style="width:auto">Z(宽)</span><input type="number" step="0.1" value="${s.y.toFixed(2)}" data-sz="${s.id}" style="width:58px">
      </div>
      <div class="row" style="margin-top:4px">
        <span class="muted" style="width:54px">挂高(m)</span>
        <input type="number" min="0.1" step="0.1" value="${s.mountH}" data-h="${s.id}">
      </div>
      <div class="muted" style="margin-top:4px">离墙：左 ${s.x.toFixed(1)} · 右 ${(L-s.x).toFixed(1)} · 前 ${s.y.toFixed(1)} · 后 ${(W-s.y).toFixed(1)} (米)</div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-list-id]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.dataset.del||e.target.dataset.m||e.target.dataset.p||e.target.dataset.h||e.target.dataset.sx||e.target.dataset.sz) return;
      state.selected = +el.dataset.listId; state.selectedPerson=null; renderAll();
    });
  });
  box.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation();
    const id=+b.dataset.del; sensors=sensors.filter(s=>s.id!==id);
    if(state.selected===id) state.selected=null; renderAll();
  }));
  box.querySelectorAll('[data-m]').forEach(c=>c.addEventListener('change', e=>{
    getSensor(+c.dataset.m).motion=e.target.checked; renderAll();
  }));
  box.querySelectorAll('[data-p]').forEach(c=>c.addEventListener('change', e=>{
    getSensor(+c.dataset.p).presence=e.target.checked; renderAll();
  }));
  box.querySelectorAll('[data-h]').forEach(i=>i.addEventListener('change', e=>{
    const v=parseFloat(e.target.value); if(v>0){ getSensor(+i.dataset.h).mountH=v; buildRoom(); fitCamera(); renderAll(); }
  }));
  box.querySelectorAll('[data-sx]').forEach(i=>i.addEventListener('change', e=>{
    const v=parseFloat(e.target.value); if(!isNaN(v)){ getSensor(+i.dataset.sx).x=clamp(v,0,L); renderAll(); }
  }));
  box.querySelectorAll('[data-sz]').forEach(i=>i.addEventListener('change', e=>{
    const v=parseFloat(e.target.value); if(!isNaN(v)){ getSensor(+i.dataset.sz).y=clamp(v,0,W); renderAll(); }
  }));
}
function renderPersonList(){
  document.getElementById('personCount').textContent = persons.length;
  const box = document.getElementById('personList');
  if(persons.length===0){ box.innerHTML='<div class="muted">暂无人物，点“添加人物”后在顶视图拖拽定位</div>'; return; }
  box.innerHTML = persons.map(p=>{
    const sc=scanHeights(p.x,p.y);
    const sel = p.id===state.selectedPerson;
    const status = sc.mH<=0 ? '<span style="color:#ff6b6b">未被任何传感器扫描</span>'
      : (sc.mH>=p.height ? `<span style="color:#2ea043">运动全覆盖 (扫描到 ${sc.mH.toFixed(2)}m)</span>`
      : `<span style="color:#ffae3b">运动扫描到 ${sc.mH.toFixed(2)}m / 身高 ${p.height.toFixed(2)}m</span>`);
    const pStatus = (state.showPresence && sc.pH>0) ? ` · 存在扫描到 ${sc.pH.toFixed(2)}m` : '';
    return `<div class="sensor-item ${sel?'sel':''}" data-plist-id="${p.id}">
      <div class="top"><b>人${p.id}</b>
        <button class="danger" data-pdel="${p.id}" style="padding:2px 8px">删</button></div>
      <div class="row" style="margin-top:4px;gap:6px">
        <span class="muted" style="width:auto">X</span><input type="number" step="0.1" value="${p.x.toFixed(2)}" data-px="${p.id}" style="width:58px">
        <span class="muted" style="width:auto">Y(宽)</span><input type="number" step="0.1" value="${p.y.toFixed(2)}" data-py="${p.id}" style="width:58px">
      </div>
      <div class="row" style="margin-top:4px">
        <span class="muted" style="width:54px">身高(m)</span>
        <input type="number" min="0.5" step="0.05" value="${p.height}" data-ph="${p.id}">
      </div>
      <div style="margin-top:4px;font-size:11px">${status}${pStatus}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-plist-id]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.dataset.pdel||e.target.dataset.ph||e.target.dataset.px||e.target.dataset.py) return;
      state.selectedPerson=+el.dataset.plistId; state.selected=null; renderAll();
    });
  });
  box.querySelectorAll('[data-pdel]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation();
    const id=+b.dataset.pdel; persons=persons.filter(p=>p.id!==id);
    if(state.selectedPerson===id) state.selectedPerson=null; renderAll();
  }));
  box.querySelectorAll('[data-ph]').forEach(i=>i.addEventListener('change', e=>{
    const v=parseFloat(e.target.value); if(v>0.3){ getPerson(+i.dataset.ph).height=v; renderAll(); }
  }));
  box.querySelectorAll('[data-px]').forEach(i=>i.addEventListener('change', e=>{
    const v=parseFloat(e.target.value); if(!isNaN(v)){ getPerson(+i.dataset.px).x=clamp(v,0,L); renderAll(); }
  }));
  box.querySelectorAll('[data-py]').forEach(i=>i.addEventListener('change', e=>{
    const v=parseFloat(e.target.value); if(!isNaN(v)){ getPerson(+i.dataset.py).y=clamp(v,0,W); renderAll(); }
  }));
}

// ---------- 总渲染 ----------
function renderAll(skipStats){
  renderTop(); renderFront(); renderSide();
  sync3D(); syncLabelPool();
  if(!skipStats){ updateStats(); renderList(); renderPersonList(); }
}

// ---------- 控件 ----------
document.getElementById('btnApply').addEventListener('click', ()=>{
  L=Math.max(0.1, parseFloat(document.getElementById('inL').value)||L);
  W=Math.max(0.1, parseFloat(document.getElementById('inW').value)||W);
  H=Math.max(0.1, parseFloat(document.getElementById('inH').value)||H);
  sensors.forEach(s=>{ s.x=clamp(s.x,0,L); s.y=clamp(s.y,0,W); s.mountH=Math.min(s.mountH,H); });
  persons.forEach(p=>{ p.x=clamp(p.x,0,L); p.y=clamp(p.y,0,W); });
  buildRoom(); fitCamera(); renderAll();
});
document.getElementById('btnFit').addEventListener('click', ()=>{
  topView.zoom=1; topView.panX=0; topView.panY=0; applyTopViewBox();
});
document.getElementById('ckMotion').addEventListener('change', e=>{ state.showMotion=e.target.checked; renderAll(); });
document.getElementById('ckPresence').addEventListener('change', e=>{ state.showPresence=e.target.checked; renderAll(); });
document.getElementById('ckBlind').addEventListener('change', e=>{ state.showBlind=e.target.checked; renderAll(); });
document.getElementById('ck3DCones').addEventListener('change', e=>{ state.show3DCones=e.target.checked; renderAll(); });
document.getElementById('ckLabels').addEventListener('change', e=>{ state.showLabels=e.target.checked; updateLabelPositions(); });
document.getElementById('btnAdd').addEventListener('click', ()=> addSensorAt(L/2, W/2));
document.getElementById('btnDel').addEventListener('click', ()=>{
  if(state.selected!=null){ sensors=sensors.filter(s=>s.id!==state.selected); state.selected=null; renderAll(); }
  else if(state.selectedPerson!=null){ persons=persons.filter(p=>p.id!==state.selectedPerson); state.selectedPerson=null; renderAll(); }
});
document.getElementById('btnClear').addEventListener('click', ()=>{
  sensors=[]; persons=[]; state.selected=null; state.selectedPerson=null; renderAll();
});
document.getElementById('btnAddPerson').addEventListener('click', ()=> addPersonAt(L/2, W/2));
document.getElementById('btnSave').addEventListener('click', ()=>{
  const data = {
    L,W,H,
    sensors: sensors.map(s=>({id:s.id,x:+s.x.toFixed(3),y:+s.y.toFixed(3),mountH:s.mountH,motion:s.motion,presence:s.presence})),
    persons: persons.map(p=>({id:p.id,x:+p.x.toFixed(3),y:+p.y.toFixed(3),height:p.height,heading:p.heading||0}))
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a=document.createElement('a'); a.download='sensor-layout.json';
  a.href=URL.createObjectURL(blob); a.click(); URL.revokeObjectURL(a.href);
});
document.getElementById('btnLoad').addEventListener('click', ()=> document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      L=d.L||L; W=d.W||W; H=d.H||H;
      document.getElementById('inL').value=L; document.getElementById('inW').value=W; document.getElementById('inH').value=H;
      sensors=(d.sensors||[]).map(s=>({id:s.id, x:s.x, y:s.y, mountH:s.mountH??2.8, motion:s.motion!==false, presence:s.presence!==false}));
      uid = sensors.reduce((m,s)=>Math.max(m,s.id),0)+1;
      persons=(d.persons||[]).map(p=>({id:p.id, x:p.x, y:p.y, height:p.height||1.7, heading:p.heading||0}));
      uidP = persons.reduce((m,p)=>Math.max(m,p.id),0)+1;
      state.selected=null; state.selectedPerson=null; buildRoom(); fitCamera(); renderAll();
    }catch(err){ alert('JSON 解析失败：'+err.message); }
  };
  r.readAsText(f); e.target.value='';
});
function exportPNG(svgId, name){
  const svg = document.getElementById(svgId);
  const clone = svg.cloneNode(true);
  const vb = svg.getAttribute('viewBox').split(' ').map(Number);
  const ar = vb[2]/vb[3];
  const Wc = 1200, Hc = Math.round(Wc/ar);
  clone.setAttribute('width', Wc); clone.setAttribute('height', Hc);
  const xml = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  img.onload=()=>{
    const canvas=document.createElement('canvas'); canvas.width=Wc; canvas.height=Hc;
    const ctx=canvas.getContext('2d'); ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,Wc,Hc); ctx.drawImage(img,0,0,Wc,Hc);
    const a=document.createElement('a'); a.download=name+'.png'; a.href=canvas.toDataURL('image/png'); a.click();
  };
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(xml)));
}
document.getElementById('btnTopPng').addEventListener('click', ()=> exportPNG('topSvg','顶视图'));
document.getElementById('btn3dPng').addEventListener('click', ()=>{
  if(!renderer){ alert('3D 未初始化'); return; }
  renderer.render(scene,camera);
  const a=document.createElement('a'); a.download='3D视图.png'; a.href=renderer.domElement.toDataURL('image/png'); a.click();
});

// ---------- 启动 ----------
setupElevDrag(document.getElementById('frontSvg'), 'x');
setupElevDrag(document.getElementById('sideSvg'), 'y');
if(typeof THREE === 'undefined'){
  document.getElementById('view3d').innerHTML = '<div style="padding:20px;color:#ff6b6b">3D 加载失败：本地 libs/three.min.js 未找到。请将本网页与 libs 文件夹放在同一目录后重试。</div>';
  // 即便 3D 不可用，仍渲染 2D 视图
  renderAll();
} else {
  requestAnimationFrame(()=>{
    try{
      init3D();
      addSensorAt(L/2, W/2);
    }catch(err){
      console.error(err);
      document.getElementById('view3d').innerHTML = '<div style="padding:20px;color:#ff6b6b">3D 初始化失败：'+(err&&err.message)+'</div>';
    }
  });
}
