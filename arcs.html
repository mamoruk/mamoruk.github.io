<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S型曲线圆弧半径计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            background: #f5f7fa;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 20px;
        }
        .input-row {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .input-item {
            flex: 1;
            min-width: 220px;
        }
        label {
            display: block;
            font-size: 15px;
            color: #444;
            margin-bottom: 6px;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d7e3;
            border-radius: 6px;
            font-size: 16px;
        }
        .result-box {
            background: #eef7ff;
            padding: 14px 18px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .result-title {
            font-size: 15px;
            color: #235;
        }
        .result-val {
            font-size: 24px;
            font-weight: bold;
            color: #0056cc;
            margin-top: 4px;
        }
        .formula {
            margin: 10px 0;
            font-size: 16px;
            color: #333;
            text-align: center;
        }
        #svgBox {
            width: 100%;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        #geoSvg {
            width: 100%;
            height: 480px;
            display: block;
            border: 1px solid #e2e8f0;
            background: #fff;
            border-radius: 8px;
            cursor: grab;
            overflow: hidden;
        }
        #geoSvg:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>S型曲线圆弧半径计算器</h2>
    <div class="formula">
        半径计算：R = (W² + H²) ÷ (4 × H) &nbsp;&nbsp;|&nbsp;&nbsp; 
        AB间距计算：W = √(4×R×H - H²)
    </div>
    <div class="input-row">
        <div class="input-item">
            <label>AB竖线水平间距 W</label>
            <input id="inputW" type="number" step="0.1" min="0.1" value="80">
        </div>
        <div class="input-item">
            <label>墙1、墙2垂直间距 H</label>
            <input id="inputH" type="number" step="0.1" min="0.1" value="60">
        </div>
        <div class="input-item">
            <label>圆弧半径 R</label>
            <input id="inputR" type="number" step="0.1" min="0.1" value="83.333">
        </div>
    </div>
    <div class="result-box">
        <div class="result-title">计算结果</div>
        <div class="result-val" id="calcResult">W=80.000，R=83.333</div>
    </div>
    <div id="svgBox">
        <svg id="geoSvg">
            <g id="world"></g>
        </svg>
    </div>
</div>

<script>
    const inputW = document.getElementById('inputW');
    const inputH = document.getElementById('inputH');
    const inputR = document.getElementById('inputR');
    const resultText = document.getElementById('calcResult');
    const svgEl = document.getElementById('geoSvg');
    const world = document.getElementById('world');

    const BASE_W = 800;
    const BASE_H = 480;

    // 视图变换状态
    let currentScale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    // 记录最后修改的输入框，避免循环计算
    let lastEditedInput = 'W';

    // 半径计算公式：通过W、H算R
    function calcR(W, H) {
        return (W * W + H * H) / (4 * H);
    }

    // AB间距计算公式：通过R、H算W
    function calcW(R, H) {
        const val = 4 * R * H - H * H;
        // 避免负数开方（非法输入防护）
        return val > 0 ? Math.sqrt(val) : 0;
    }

    // 更新视图变换
    function updateTransform() {
        world.setAttribute('transform', `translate(${translateX}, ${translateY}) scale(${currentScale})`);
    }

    // 自适应适配视图
    function fitToView() {
        const svgRect = svgEl.getBoundingClientRect();
        const scaleX = svgRect.width / BASE_W;
        const scaleY = svgRect.height / BASE_H;
        currentScale = Math.min(scaleX, scaleY) * 0.9;
        translateX = (svgRect.width - BASE_W * currentScale) / 2;
        translateY = (svgRect.height - BASE_H * currentScale) / 2;
        updateTransform();
    }

    // 绘制图形
    function render() {
        let W = Number(inputW.value);
        let H = Number(inputH.value);
        let R = Number(inputR.value);

        // 根据最后修改的输入框，自动计算对应值
        if (lastEditedInput === 'W' || lastEditedInput === 'H') {
            R = calcR(W, H);
            inputR.value = R.toFixed(3);
        } else if (lastEditedInput === 'R') {
            W = calcW(R, H);
            inputW.value = W.toFixed(3);
        }

        // 更新结果显示
        resultText.textContent = `W=${W.toFixed(3)}，R=${R.toFixed(3)}`;

        const pad = 70;
        const drawW = BASE_W - pad * 2;
        const drawH = BASE_H - pad * 2;
        
        // 完整几何边界：水平W+2R，垂直4R-H
        const geoWidth = W + 2 * R;
        const geoHeight = 4 * R - H;
        const scale = Math.min(drawW / geoWidth, drawH / geoHeight);

        // 实际像素尺寸 + 居中偏移
        const actualW = geoWidth * scale;
        const actualH = geoHeight * scale;
        const offsetX = pad + (drawW - actualW) / 2;
        const offsetY = pad + (drawH - actualH) / 2;

        // 核心坐标计算
        const wall1Y = offsetY + (2 * R - H) * scale;   // 墙1（上）
        const wall2Y = offsetY + 2 * R * scale;         // 墙2（下）
        const lineA_x = offsetX + R * scale;            // A竖线（左圆心x）
        const lineB_x = lineA_x + W * scale;            // B竖线（右圆心x）

        const cA_x = lineA_x;
        const cA_y = wall2Y - R * scale;                // 左圆心O1
        const cB_x = lineB_x;
        const cB_y = wall1Y + R * scale;                // 右圆心O2

        // 切点坐标（两圆心连线中点）
        const tan_x = (cA_x + cB_x) / 2;
        const tan_y = (cA_y + cB_y) / 2;

        // S曲线起止点
        const startX = cA_x;
        const startY = wall2Y;
        const endX = cB_x;
        const endY = wall1Y;

        // 墙线左右延伸量
        const lineExtend = 50;
        const lineLeft = offsetX - lineExtend;
        const lineRight = offsetX + actualW + lineExtend;

        // 竖线上下延伸量
        const vertTop = offsetY - 20;
        const vertBottom = offsetY + actualH + 20;

        let svg = '';

        // 1. 三条水平线（墙1、墙2、中间虚线）
        svg += `<line x1="${lineLeft}" y1="${wall1Y}" x2="${lineRight}" y2="${wall1Y}" stroke="#9fa0a0" stroke-width="2"/>`;
        svg += `<text x="${lineRight + 12}" y="${wall1Y + 5}" font-size="22" fill="#000">墙1</text>`;
        
        svg += `<line x1="${lineLeft}" y1="${wall2Y}" x2="${lineRight}" y2="${wall2Y}" stroke="#9fa0a0" stroke-width="2"/>`;
        svg += `<text x="${lineLeft - 60}" y="${wall2Y + 5}" font-size="22" fill="#000">墙2</text>`;

        // 中间水平虚线
        const midY = (wall1Y + wall2Y) / 2;
        svg += `<line x1="${lineLeft}" y1="${midY}" x2="${lineRight}" y2="${midY}" stroke="#d62222" stroke-width="1" stroke-dasharray="4,4"/>`;

        // 2. A、B红色竖直虚线 + 中间竖虚线
        svg += `<line x1="${lineA_x}" y1="${vertTop}" x2="${lineA_x}" y2="${vertBottom}" stroke="#d62222" stroke-width="1.5" stroke-dasharray="6,6"/>`;
        svg += `<text x="${lineA_x - 8}" y="${vertTop - 10}" font-size="28" fill="#000">A</text>`;
        
        svg += `<line x1="${lineB_x}" y1="${vertTop}" x2="${lineB_x}" y2="${vertBottom}" stroke="#d62222" stroke-width="1.5" stroke-dasharray="6,6"/>`;
        svg += `<text x="${lineB_x - 8}" y="${vertTop - 10}" font-size="28" fill="#000">B</text>`;

        // 中间竖直虚线
        const midX = (lineA_x + lineB_x) / 2;
        svg += `<line x1="${midX}" y1="${vertTop}" x2="${midX}" y2="${vertBottom}" stroke="#d62222" stroke-width="1" stroke-dasharray="4,4"/>`;

        // 3. 红色虚线辅助圆
        svg += `<circle cx="${cA_x}" cy="${cA_y}" r="${R * scale}" fill="none" stroke="#f25858" stroke-width="1.2" stroke-dasharray="8,5"/>`;
        svg += `<circle cx="${cB_x}" cy="${cB_y}" r="${R * scale}" fill="none" stroke="#f25858" stroke-width="1.2" stroke-dasharray="8,5"/>`;

        // 4. 圆心十字标记 + 编号
        const crossSize = 6;
        // O1 左圆心
        svg += `<line x1="${cA_x - crossSize}" y1="${cA_y}" x2="${cA_x + crossSize}" y2="${cA_y}" stroke="#000" stroke-width="1"/>`;
        svg += `<line x1="${cA_x}" y1="${cA_y - crossSize}" x2="${cA_x}" y2="${cA_y + crossSize}" stroke="#000" stroke-width="1"/>`;
        svg += `<text x="${cA_x + 10}" y="${cA_y - 8}" font-size="16" fill="#000">O₁</text>`;
        // O2 右圆心
        svg += `<line x1="${cB_x - crossSize}" y1="${cB_y}" x2="${cB_x + crossSize}" y2="${cB_y}" stroke="#000" stroke-width="1"/>`;
        svg += `<line x1="${cB_x}" y1="${cB_y - crossSize}" x2="${cB_x}" y2="${cB_y + crossSize}" stroke="#000" stroke-width="1"/>`;
        svg += `<text x="${cB_x - 22}" y="${cB_y - 8}" font-size="16" fill="#000">O₂</text>`;

        // 5. 半径尺寸标注（带数值）
        const dimOffset = 18;
        const tickLen = 4;
        // 左圆半径 O₁ → 墙2
        svg += `<line x1="${cA_x - dimOffset}" y1="${cA_y}" x2="${cA_x - dimOffset}" y2="${wall2Y}" stroke="#333" stroke-width="1"/>`;
        svg += `<line x1="${cA_x - dimOffset - tickLen}" y1="${cA_y}" x2="${cA_x - dimOffset + tickLen}" y2="${cA_y}" stroke="#333" stroke-width="1"/>`;
        svg += `<line x1="${cA_x - dimOffset - tickLen}" y1="${wall2Y}" x2="${cA_x - dimOffset + tickLen}" y2="${wall2Y}" stroke="#333" stroke-width="1"/>`;
        svg += `<text x="${cA_x - dimOffset - tickLen - 8}" y="${(cA_y + wall2Y) / 2 + 5}" font-size="14" fill="#333" text-anchor="end">R=${R.toFixed(2)}</text>`;

        // 右圆半径 O₂ → 墙1
        svg += `<line x1="${cB_x + dimOffset}" y1="${cB_y}" x2="${cB_x + dimOffset}" y2="${wall1Y}" stroke="#333" stroke-width="1"/>`;
        svg += `<line x1="${cB_x + dimOffset - tickLen}" y1="${cB_y}" x2="${cB_x + dimOffset + tickLen}" y2="${cB_y}" stroke="#333" stroke-width="1"/>`;
        svg += `<line x1="${cB_x + dimOffset - tickLen}" y1="${wall1Y}" x2="${cB_x + dimOffset + tickLen}" y2="${wall1Y}" stroke="#333" stroke-width="1"/>`;
        svg += `<text x="${cB_x + dimOffset + tickLen + 8}" y="${(cB_y + wall1Y) / 2 + 5}" font-size="14" fill="#333" text-anchor="start">R=${R.toFixed(2)}</text>`;

        // 6. 黑色S型光滑曲线
        const rScaled = R * scale;
        const sPath = `
            M ${startX} ${startY}
            A ${rScaled} ${rScaled} 0 0 0 ${tan_x} ${tan_y}
            A ${rScaled} ${rScaled} 0 0 1 ${endX} ${endY}
        `;
        svg += `<path d="${sPath}" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>`;

        world.innerHTML = svg;
    }

    // ========== 输入事件处理 ==========
    // 记录最后编辑的输入框，避免循环计算
    inputW.addEventListener('input', () => {
        lastEditedInput = 'W';
        render();
    });
    inputH.addEventListener('input', () => {
        lastEditedInput = 'H';
        render();
    });
    inputR.addEventListener('input', () => {
        lastEditedInput = 'R';
        render();
    });

    // ========== 鼠标交互 ==========
    svgEl.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        translateX += e.clientX - lastMouseX;
        translateY += e.clientY - lastMouseY;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        updateTransform();
    });

    window.addEventListener('mouseup', () => isDragging = false);
    svgEl.addEventListener('mouseleave', () => isDragging = false);

    // 滚轮缩放（以鼠标为中心）
    svgEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = svgEl.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        const factor = e.deltaY > 0 ? 0.9 : 1.1;
        const newScale = Math.max(0.3, Math.min(8, currentScale * factor));

        const wx = (mx - translateX) / currentScale;
        const wy = (my - translateY) / currentScale;
        translateX = mx - wx * newScale;
        translateY = my - wy * newScale;
        currentScale = newScale;

        updateTransform();
    }, { passive: false });

    // 双击重置视图
    svgEl.addEventListener('dblclick', fitToView);
    window.addEventListener('resize', fitToView);

    // 初始化
    render();
    fitToView();
</script>
</body>
</html>
